name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 语法检查 + 冒烟测试：不联网、不调模型
      - name: Verify
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js; do node --check "$file"; done
          node test/smoke.mjs
          node test/client.mjs
          node test/integration.mjs

      # 标签与包内版本必须一致，避免发出版本和标签对不上
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG 与 package.json version $PKG 不一致" >&2
            exit 1
          fi

      # 包名不能带作用域：npmjs 上 dsh-code-notes 未占用，任何人可匿名安装
      - name: Guard package name and registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          REG="$(node -p "require('./package.json').publishConfig.registry")"
          case "$NAME" in
            @*) echo "公共 npmjs 不接受别人作用域的包名：$NAME" >&2; exit 1 ;;
          esac
          if [ "$REG" != "https://registry.npmjs.org" ]; then
            echo "publishConfig.registry 必须是 https://registry.npmjs.org，当前 $REG" >&2
            exit 1
          fi

      - name: Publish to npmjs
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
