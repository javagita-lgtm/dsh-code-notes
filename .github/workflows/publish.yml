name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      strategy:
        description: '发布方式'
        type: choice
        options:
          - auto          # 有 token 就走 token；没有且包已存在就走 OIDC
          - token         # 强制用 NPM_TOKEN
          - oidc          # 强制用 Trusted Publishing（包必须已存在）
          - staged        # 暂存发布：CI 只 stage，由维护者在 npm 网页用 2FA 批准
          - dry-run       # 只打包校验，不发布
        default: auto

permissions:
  contents: read
  # npm provenance，以及 OIDC Trusted Publishing
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      STRATEGY: ${{ inputs.strategy || 'auto' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm stage（暂存发布）需要较新的 CLI；Node 22 自带 10.x
      - name: Upgrade npm
        run: |
          npm install -g npm@latest || echo "npm 升级失败，继续用自带版本"
          npm --version

      - name: Verify
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js; do node --check "$file"; done
          node test/smoke.mjs
          node test/client.mjs
          node test/integration.mjs
          node test/workflow.mjs

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG 与 package.json version $PKG 不一致" >&2
            exit 1
          fi

      - name: Guard package name and registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          REG="$(node -p "require('./package.json').publishConfig.registry")"
          case "$NAME" in
            @*) echo "公共 npmjs 不接受别人作用域的包名：$NAME" >&2; exit 1 ;;
          esac
          if [ "$REG" != "https://registry.npmjs.org" ]; then
            echo "publishConfig.registry 必须是 https://registry.npmjs.org，当前 $REG" >&2
            exit 1
          fi

      - name: Detect registry state
        id: state
        run: |
          PKG="$(node -p "require('./package.json').name")"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "包已存在于 npmjs"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "包尚未发布到 npmjs"
          fi

      # 只在 token 分支准备凭据；全程不打印 token
      - name: Prepare npm credentials
        if: env.NPM_TOKEN != '' && env.STRATEGY != 'oidc'
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          chmod 600 "$RUNNER_TEMP/npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          case "$NPM_TOKEN" in
            npm_*) echo "token 形态: granular（npm_ 前缀）" ;;
            *) echo "::warning::token 不以 npm_ 开头，可能是 classic token（npm 已移除）或粘贴有误" ;;
          esac
          if ! WHOAMI="$(npm whoami 2>&1)"; then
            echo "::error title=NPM_TOKEN 无效::npm whoami 失败：$WHOAMI"
            echo "请到 https://www.npmjs.com/settings/~/tokens 重新生成后更新 secret NPM_TOKEN。"
            exit 1
          fi
          echo "token 对应账号: $WHOAMI"

      - name: Publish (dry run)
        if: env.NPM_TOKEN != '' && env.STRATEGY == 'dry-run'
        run: |
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish --dry-run --access public

      # ── 方案 C：暂存发布。CI 只把版本推进 npm 的 staged 队列，
      #    维护者随后在 npm 网页用 2FA 批准，天然规避「CI 无法完成交互式 2FA」。
      #    npm 12+ 才有 `npm stage`，Node 22 自带的 10/11 没有这个子命令。
      - name: Publish (staged)
        if: env.STRATEGY == 'staged'
        run: |
          if ! npm stage --help >/dev/null 2>&1; then
            echo "::warning::当前 npm $(npm --version) 没有 stage 子命令，安装 npm@12 后重试"
            npm install -g npm@12 || {
              echo "::error title=无法安装 npm@12::请本地执行 npm stage publish，或改用 strategy=token"
              exit 1
            }
            npm --version
          fi
          if ! npm stage --help >/dev/null 2>&1; then
            echo "::error title=npm 仍不支持 stage::请本地交互式发布，见 docs/publish-to-npm.md 方案 A"
            exit 1
          fi
          if [ -n "$NPM_TOKEN" ]; then
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc"
          fi
          npm stage publish --access public
          echo "::notice title=已进入暂存队列::到 https://www.npmjs.com/package/$(node -p "require('./package.json').name") 用 2FA 批准这一版"

      - name: Publish with NPM_TOKEN
        if: env.NPM_TOKEN != '' && (env.STRATEGY == 'auto' || env.STRATEGY == 'token')
        run: |
          set +e
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish --provenance --access public
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            cat <<'HINT'

          ────────────────────────────────────────────────────────────────
          403 “...with bypass 2fa enabled is required” 的自查顺序：
            1) 账号是否已开启 2FA：https://www.npmjs.com/settings/~/account
               —— 账号没开 2FA 时，token 上的 Bypass 选项不生效，发布永远被拒
            2) token 是否勾了 Bypass two-factor authentication：在 token 列表里能看到该标记
            3) Packages 是否选了 All packages（首次发布时包里还没有这个包名）
            4) Permissions 是否为 Read and write
            5) 改完 token 后 secret 是否真的更新了（新建 token ≠ 更新 secret）

          仍不通就换方案：
            · 本地交互发布一次（最快）：本机 npm login 后 npm publish --access public
            · 或在 Actions 里选 strategy=staged，走暂存发布后网页批准
          详见 docs/publish-to-npm.md。
          ────────────────────────────────────────────────────────────────
          HINT
            exit $status
          fi

      - name: Publish with OIDC trusted publishing
        if: env.STRATEGY == 'oidc' || (env.STRATEGY == 'auto' && env.NPM_TOKEN == '')
        run: |
          if [ "${{ steps.state.outputs.published }}" != "true" ]; then
            echo "::error title=缺少 NPM_TOKEN::npm 不允许用 OIDC 创建新包，首次发布必须先用 token、暂存发布或本地交互发布。"
            echo "见 docs/publish-to-npm.md。"
            exit 1
          fi
          npm publish --provenance --access public
