name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance，以及 OIDC Trusted Publishing
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 可能是空串：下面用 if 判断走 token 还是 OIDC
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted Publishing（OIDC）需要 npm >= 11.5.1，Node 22 自带的是 10.x
      - name: Upgrade npm
        run: |
          npm install -g npm@latest || echo "npm 升级失败，继续使用自带版本"

      - name: Verify
        run: |
          node --check index.js
          node --check client.js
          for file in lib/*.js; do node --check "$file"; done
          node test/smoke.mjs
          node test/client.mjs
          node test/integration.mjs

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG 与 package.json version $PKG 不一致" >&2
            exit 1
          fi

      - name: Guard package name and registry
        run: |
          NAME="$(node -p "require('./package.json').name")"
          REG="$(node -p "require('./package.json').publishConfig.registry")"
          case "$NAME" in
            @*) echo "公共 npmjs 不接受别人作用域的包名：$NAME" >&2; exit 1 ;;
          esac
          if [ "$REG" != "https://registry.npmjs.org" ]; then
            echo "publishConfig.registry 必须是 https://registry.npmjs.org，当前 $REG" >&2
            exit 1
          fi

      # 包是否已在 npmjs 上（首次发布不能用 OIDC 创建新包）
      - name: Detect registry state
        id: state
        run: |
          PKG="$(node -p "require('./package.json').name")"
          if npm view "$PKG" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "包已存在于 npmjs"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "包尚未发布到 npmjs"
          fi
        env:
          NPM_TOKEN: ''

      # 有 token 就先确认它可用，并写一个只在本步骤可见的临时 npmrc
      - name: Prepare npm credentials
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$RUNNER_TEMP/npmrc"
          chmod 600 "$RUNNER_TEMP/npmrc"
          if ! NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm whoami; then
            echo "::error title=NPM_TOKEN 无效::token 可能已过期或被撤销，请到 https://www.npmjs.com/settings/~/tokens 重新生成"
            exit 1
          fi
          echo "token 有效"

      - name: Publish with NPM_TOKEN
        if: env.NPM_TOKEN != ''
        run: |
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc" npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 没有 token 时退回 OIDC Trusted Publishing（仅对已存在的包有效）
      - name: Publish with OIDC trusted publishing
        if: env.NPM_TOKEN == ''
        run: |
          if [ "${{ steps.state.outputs.published }}" != "true" ]; then
            echo "::error title=缺少 NPM_TOKEN::npm 不允许用 OIDC 创建新包，首次发布必须先用 token。"
            echo "请创建 granular access token（Read and write + All packages + 勾选 Bypass 2FA），"
            echo "存为仓库 secret NPM_TOKEN 后重跑。详见 docs/publish-to-npm.md。"
            exit 1
          fi
          npm publish --provenance --access public

      - name: Explain 403
        if: failure() && env.NPM_TOKEN != ''
        run: |
          echo "::warning title=若上方报 403 / 2FA::"
          echo "错误包含 “Two-factor authentication or granular access token with bypass 2fa enabled is required” 时："
          echo "token 没有勾选 Bypass 2FA。重建 Granular Access Token 时必须勾选："
          echo "  Permissions: Read and write"
          echo "  Packages: All packages（首次发布不能选单个包，因为包还不存在）"
          echo "  Bypass two-factor authentication (2FA): 必须勾"
          echo "然后更新 secret NPM_TOKEN 并重跑。详见 docs/publish-to-npm.md。"
